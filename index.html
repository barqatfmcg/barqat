<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barqat App</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
        background: #ffffff;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
    }

    .container {
        max-width: 420px;
        width: 100%;
    }

    .app-icon {
        width: 90px;
        height: 90px;
        background: #00B14F;
        border-radius: 22px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto 20px;
    }

    .app-icon span {
        font-size: 48px;
        font-weight: bold;
        color: #fff;
    }

    .title {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .tagline {
        font-size: 16px;
        color: #777;
        margin-bottom: 26px;
    }

    /* QR */
    .qr-box {
        padding: 16px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        width: fit-content;
        margin: 0 auto 30px;
    }

    .qr-box img {
        width: 200px;
        height: 200px;
    }

    /* Button */
    .download-btn {
        display: block;
        width: 100%;
        max-width: 280px;
        margin: 0 auto;
        padding: 16px;
        background: linear-gradient(to right, #007bff, #ff7a18);
        text-decoration: none;
        color: #fff;
        font-size: 17px;
        font-weight: 600;
        border-radius: 14px;
        box-shadow: 0 6px 14px rgba(0,0,0,0.12);
        transition: 0.2s ease;
    }

    .download-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
    }

    .footer {
        font-size: 13px;
        color: #888;
        margin-top: 28px;
    }
</style>
</head>

<body>
<div class="container">

    <div class="app-icon"><span>B</span></div>

    <div class="title">Barqat</div>
    <div class="tagline">Your Smart FMCG Ordering Partner</div>

    <div class="qr-box">
        <!-- Replace with your generated QR -->
        <img src="qr.png" alt="QR Code">
    </div>

    <a href="https://github.com/barqatfmcg/barqat/releases/download/v1.2.0/barqat.apk" class="download-btn">Download the App</a>

    <div class="footer">Built with ❤️ by Barqat Team</div>

</div>
</body>
</html>
